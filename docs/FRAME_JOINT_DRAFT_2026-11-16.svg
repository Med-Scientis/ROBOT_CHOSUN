<text x="62" y="900" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#16354A">1  종이 본을 100%로 출력 → 50mm 눈금 확인 → 판지에 붙여 중심끼리 연결</text>
<text x="62" y="941" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#16354A">2  전원 없이 팔 옆에 대어 길이·찍찍이 위치·굽힘 간섭 확인</text>
<text x="62" y="982" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#16354A">3  팔 바깥 돌출과 축 고정 상세를 확인한 뒤 가공 도면·견적 진행</text>
<text x="45" y="1045" dominant-baseline="text-before-edge" font-family="Malgun Gothic,sans-serif" font-size="18" font-weight="400" fill="#647684">파랑 = 고정측   /   주황 = 풀리   /   회색 = 회전축   /   초록 = 아래팔측   |   강도·착용 검증 전</text>
